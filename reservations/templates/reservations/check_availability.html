{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Проверить доступные столики</h2>
    <div class="card shadow p-4 bg-transparent">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.date.label_tag }}
                {{ form.date }}
            </div>
            <div class="mb-3">
                {{ form.start_time.label_tag }}
                {{ form.start_time }}
            </div>
            <div class="mb-3">
                {{ form.end_time.label_tag }}
                {{ form.end_time }}
            </div>
            <button type="submit" class="btn btn-primary">Проверить доступные столики</button>
        </form>
    </div>
</div>

{% endblock %}
