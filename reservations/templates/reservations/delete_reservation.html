{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Удаление брони</h2>
    <p>Вы уверены, что хотите удалить бронь на {{ reservation.date }} с {{ reservation.start_time }} до {{ reservation.end_time }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'reservations:user_reservations' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
